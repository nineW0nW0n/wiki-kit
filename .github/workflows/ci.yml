---
name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -r requirements.txt pytest==9.1.1
      - name: validate template
        run: python3 scripts/okf_validate.py template --strict
      - name: lint tests
        run: pytest tests/test_lint.py -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: smoke (build + lint template + FTS5 + site build)
        run: bash tests/smoke.sh
      - name: compose test (builder loop + Caddy routes)
        run: bash tests/compose-test.sh

  publish:
    needs: [secrets, test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          tags: wiki-kit:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Gate on what we ship and own: OS packages and our pip deps.
      # /opt/quartz's node tree is pinned by Quartz's own lockfile (build-time
      # tooling over trusted markdown); npm's bundled modules ship with the
      # nodejs deb. Their CVEs are upstream's to fix, not release blockers.
      - name: trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: wiki-kit:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /opt/quartz,/usr/lib/node_modules
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wiki-kit
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
