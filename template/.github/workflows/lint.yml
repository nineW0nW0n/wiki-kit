---
name: lint

on:  # yamllint disable-line rule:truthy
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, wiki]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: lint (PR mode)
        env:
          BASE: ${{ github.base_ref }}
        run: >
          docker run --rm -v "$PWD:/bundle" {{IMAGE}}
          lint /bundle --pr --base "origin/$BASE"
