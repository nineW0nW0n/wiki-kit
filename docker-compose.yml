---
# wiki-kit deployment (HANDOFF §7/§8/§9). The node provides bundles.yml next
# to this file (or set BUNDLES_YML). Port 8080 stays exposed for local/LAN
# use; in production run `--profile tunnel` and firewall the port off —
# cloudflared is the way in. `--profile ci` adds the bundle-repo runner.
services:
  builder:
    build: .
    environment:
      GIT_TOKEN: "${GIT_TOKEN:-}"
      INTERVAL: "${INTERVAL:-}"
    volumes:
      - "${BUNDLES_YML:-./bundles.yml}:/etc/wiki/bundles.yml:ro"
      - bundles:/bundles
      - site:/site
      - state:/state
    restart: unless-stopped

  web:
    image: caddy:2.11.4-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bundles:/bundles:ro
      - site:/site:ro
      - state:/state:ro
    restart: unless-stopped

  mcp:
    build: .
    command: ["python3", "mcp/server.py"]
    volumes:
      - "${BUNDLES_YML:-./bundles.yml}:/etc/wiki/bundles.yml:ro"
      - bundles:/bundles:ro
      - state:/state:ro
    restart: unless-stopped

  intake:
    build: .
    command: ["intake"]
    environment:
      INTAKE_TOKEN: "${INTAKE_TOKEN:-}"
      INTAKE_DRY_RUN: "${INTAKE_DRY_RUN:-1}"
    volumes:
      - "${BUNDLES_YML:-./bundles.yml}:/etc/wiki/bundles.yml:ro"
      - bundles:/bundles:ro
    restart: unless-stopped

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel run
    environment:
      # compose interpolates even profile-gated services, so no :? guard;
      # cloudflared itself exits loudly if the token is empty
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    restart: unless-stopped

  # Self-hosted runner for the private brain-* repos ONLY — never attach to
  # the public wiki-kit repo (HANDOFF §3). Ephemeral: re-registers per job;
  # RUNNER_TOKEN is a short-lived registration token
  # (gh api -X POST repos/<owner>/<repo>/actions/runners/registration-token).
  runner:
    profiles: [ci]
    image: ghcr.io/actions/actions-runner:2.336.0
    command: >
      sh -c './config.sh --url "$$REPO_URL" --token "$$RUNNER_TOKEN"
      --labels wiki --unattended --ephemeral --replace && ./run.sh'
    environment:
      REPO_URL: "${REPO_URL:-}"
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  bundles:
  site:
  state:
